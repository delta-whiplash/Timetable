name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Run backend tests
        run: |
          cd src-tauri
          cargo test --no-default-features

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Set MSVC compiler flags
        run: |
          echo "CXXFLAGS=/std:c++17 /EHsc" >> $env:GITHUB_ENV
          echo "CFLAGS=/EHsc" >> $env:GITHUB_ENV
      - name: Build Tauri app
        run: pnpm run tauri:build
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - name: Upload MSI installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Cache apt packages
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tauri app
        run: pnpm run tauri:build
      - name: Upload AppImage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v2.1.0
        with:
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Tauri app (universal)
        run: |
          pnpm run tauri:build -- --target universal-apple-darwin
      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.dmg"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            artifacts/windows-nsis/*.exe
            artifacts/windows-msi/*.msi
            artifacts/linux-appimage/*.AppImage
            artifacts/macos-dmg/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
