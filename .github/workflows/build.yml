name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS Universal Binary (x86_64 + aarch64)
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache Cargo registry index
      - name: Cache Cargo registry index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: cargo-macos-registry-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos-registry-index-

      # Cache Cargo build artifacts (aggressive)
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-macos-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos-build-

      # Cache npm modules
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .npm
          key: node-macos-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-macos-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application (macOS)
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload APP bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/*/release/bundle/macos/*.app
          if-no-files-found: ignore

  # Windows x64
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache Cargo registry index
      - name: Cache Cargo registry index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: cargo-windows-registry-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-windows-registry-index-

      # Cache Cargo build artifacts (aggressive)
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-windows-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-windows-build-

      # Cache npm modules
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .npm
          key: node-windows-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-windows-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application (Windows)
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Rename MSI with version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msi) {
            $newName = "Timetable-Desktop_${version}_x64_windows.msi"
            Copy-Item $msi.FullName -Destination $newName
            echo "MSI_RENAMED=$newName" >> $env:GITHUB_ENV
          }

      - name: Rename NSIS with version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($exe) {
            $newName = "Timetable-Desktop_${version}_x64_windows.exe"
            Copy-Item $exe.FullName -Destination $newName
            echo "NSIS_RENAMED=$newName" >> $env:GITHUB_ENV
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: ${{ env.MSI_RENAMED }}
          if-no-files-found: error

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: ${{ env.NSIS_RENAMED }}
          if-no-files-found: ignore

  # Linux AppImage
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Cache Cargo registry index
      - name: Cache Cargo registry index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: cargo-linux-registry-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-linux-registry-index-

      # Cache Cargo build artifacts (aggressive)
      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-linux-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-linux-build-

      # Cache npm modules
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .npm
          key: node-linux-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-linux-

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application (Linux)
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Attach artifacts to GitHub Release
  release:
    name: Attach to Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
