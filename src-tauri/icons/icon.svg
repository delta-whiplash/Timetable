<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGradient)"/>

  <!-- Calendar/Time tracking icon -->
  <g transform="translate(512, 512)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="url(#clockGradient)" stroke-width="40"/>

    <!-- Clock marks -->
    <g stroke="url(#clockGradient)" stroke-width="20" stroke-linecap="round">
      <line x1="0" y1="-240" x2="0" y2="-200"/>
      <line x1="240" y1="0" x2="200" y2="0"/>
      <line x1="0" y1="240" x2="0" y2="200"/>
      <line x1="-240" y1="0" x2="-200" y2="0"/>
    </g>

    <!-- Hour hand (showing 9 o'clock - work start) -->
    <line x1="0" y1="0" x2="-100" y2="-60" stroke="url(#clockGradient)" stroke-width="35" stroke-linecap="round"/>

    <!-- Minute hand (showing 5 o'clock - work end) -->
    <line x1="0" y1="0" x2="80" y2="140" stroke="url(#clockGradient)" stroke-width="25" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="30" fill="url(#clockGradient)"/>

    <!-- Small calendar sheets on side -->
    <g transform="translate(180, -180)">
      <rect x="0" y="0" width="100" height="120" rx="10" fill="white" opacity="0.9"/>
      <line x1="20" y1="30" x2="80" y2="30" stroke="#3b82f6" stroke-width="8"/>
      <line x1="20" y1="55" x2="80" y2="55" stroke="#3b82f6" stroke-width="8"/>
      <line x1="20" y1="80" x2="60" y2="80" stroke="#3b82f6" stroke-width="8"/>
    </g>
  </g>

  <!-- "TT" monogram in bottom right -->
  <text x="850" y="920" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" opacity="0.8">TT</text>
</svg>
