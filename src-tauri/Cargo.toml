[package]
name = "timetable-desktop"
version = "1.2.0"
description = "Application Windows de suivi et calcul des heures de travail hebdomadaires"
authors = ["Delta"]
license = "MIT"
edition = "2021"
rust-version = "1.91"

[lib]
name = "timetable_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "timetable-desktop"
path = "src/main.rs"

[features]
default = ["desktop", "storage-duckdb"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "storage-duckdb"]
storage-duckdb = ["dep:duckdb", "dep:rust_xlsxwriter"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
duckdb = { version = "1.4.1", features = ["bundled"], optional = true }
rust_xlsxwriter = { version = "0.99.0", features = ["chrono"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.8.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
thiserror = "2.0.16"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1.8.0"
tempfile = "3.22.0"
